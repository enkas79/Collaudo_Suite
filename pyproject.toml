[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collaudo-suite"
version = "1.1.8"
description = "Suite desktop PySide6 per il collaudo software: analizza le anomalie ricorrenti, le trasforma in controlli operativi e li integra nella checklist di collaudo, con periodo MAP configurabile, salvataggio lavori, esportazione PDF e verifica automatica degli aggiornamenti."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "matplotlib>=3.8",
    "rapidfuzz>=3.6",
    "python-docx>=1.1.2",
    "reportlab>=4.2",
    "nltk>=3.8",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]

[project.scripts]
collaudo-suite = "collaudo_suite.main:main"

[tool.setuptools]
packages = [
    "collaudo_suite",
    "collaudo_suite.analyzer",
    "collaudo_suite.checklist",
    "collaudo_suite.checklist.data",
]

[tool.setuptools.package-data]
"collaudo_suite.checklist.data" = ["*.docx", "*.xlsx", "schede/*.docx"]
